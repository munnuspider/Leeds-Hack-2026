<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galaxy Leaderboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
    }

    h1 {
      position: absolute;
      top: 60px;
      font-size: 48px;
      font-weight: 300;
    }

    /* Outer card - Matches your Auth file exactly */
    .card {
      width: 90%;
      max-width: 900px;
      padding: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1f2a6d, #6a2c70);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    /* Inner panel */
    .panel {
      padding: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3a4aa8, #b14d9b);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      font-size: 26px;
      padding: 15px;
      text-align: left;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      color: #ff7ac7;
    }

    td {
      padding: 20px;
      font-size: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .impact-score {
      color: #00ff88;
      font-weight: bold;
      text-align: right;
    }

    #status {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <h1>Galaxy Leaderboard</h1>

  <div class="card">
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Pilot</th>
            <th style="text-align: right;">CO2 Saved</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          </tbody>
      </table>
      <div id="status">Scanning Sector for Explorers...</div>
    </div>
  </div>

  <script>
    // ⚠️ UPDATE THIS: Put your Flask server URL here (from the Ports tab)
    const API_URL = "https://your-codespace-url-5000.app.github.dev/leaderboard";

    async function fetchBoard() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            const tableBody = document.getElementById('leaderboard-body');
            
            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center;">No data found. Start recycling!</td></tr>';
                return;
            }

            // This maps your Flask 'leaderboard_data' list to table rows
            tableBody.innerHTML = data.map(player => `
                <tr>
                    <td>🤖 ${player.username}</td>
                    <td class="impact-score">${player.co2_saved.toFixed(3)} kg</td>
                </tr>
            `).join('');

            document.getElementById('status').innerText = "Live Telemetry Active";
        } catch (err) {
            document.getElementById('status').innerText = "Connection to Galaxy HQ Lost.";
        }
    }

    // This makes the board update every 5 seconds without refreshing
    setInterval(fetchBoard, 5000);
    fetchBoard();
  </script>
</body>
</html>
