<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up / Login</title>

  <style>
    /* ... (Your existing styles remain exactly as they were) ... */
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
    }

    h1 {
      position: absolute;
      top: 60px;
      font-size: 48px;
      font-weight: 300;
    }

    .card {
      width: 90%;
      max-width: 500px; /* Adjusted width for better embed scaling */
      padding: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1f2a6d, #6a2c70);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .panel {
      padding: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3a4aa8, #b14d9b);
    }

    .field {
      margin-bottom: 35px;
    }

    .field label {
      display: block;
      font-size: 28px;
      margin-bottom: 15px;
      text-align: center;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border-radius: 12px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #5866d9, #e064b7);
    }

    .icon {
      font-size: 26px;
      margin-right: 14px;
    }

    .input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 20px;
    }

    .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #6b7cff, #ff7ac7);
      font-weight: bold;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.02);
      opacity: 0.9;
    }

    #status-msg {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Sign Up / Login</h1>

  <div class="card">
    <div class="panel">

      <div class="field">
