<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Earth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: black;
      color: white;
      overflow-x: hidden;
    }

    /* Star background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(white 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.3;
      z-index: -1;
    }

    /* Top navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px 20px;
    }

    nav a {
      text-decoration: none;
      color: white;
      border: 2px solid white;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 14px;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    nav a:hover {
      background: white;
      color: black;
    }

    /* Main content */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 40px;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 300;
      line-height: 1.3;
      max-width: 900px;
      margin-bottom: 40px;
    }

    .highlight {
      background: linear-gradient(90deg, #6a5cff, #d46cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 500;
    }

    /* Earth image */
    .earth {
      width: min(600px, 90vw);
      margin-top: 20px;
    }

    .earth img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="your-earth.html">YOUR EARTH</a>
    <a href="daily-tasks.html">DAILY TASKS</a>
    <a href="leaderboard.html">LEADERBOARD</a>
    <a href="about.html">ABOUT</a>
  </nav>

  <!-- Main section -->
  <main class="hero">
    <h1>
      Together, we’ve saved
      <span class="highlight">10000</span>
      bottles from landfill!
    </h1>

    <div class="earth">
      <img src="earth.png" alt="Earth view" />
    </div>
  </main>

</body>

</html>
