<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: transparent; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 80%; border-radius: 5px; border: 1px solid #444; background: #222; color: white; }
        button { background: #2ecc71; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #27ae60; }
        #status { margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h3>Space Login</h3>
    <input type="text" id="username" placeholder="Username (Try: Pilot)">
    <input type="password" id="password" placeholder="Password (Try: Galaxy123)">
    <button onclick="checkLogin()">Launch</button>
    <p id="status"></p>

    <script>
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const status = document.getElementById('status');

            // Predetermined Login Logic
            if (user === "Pilot" && pass === "Galaxy123") {
                status.style.color = "#2ecc71";
                status.innerText = "Access Granted! Welcome, Pilot.";
                
                // Save the username so the Leaderboard and Predictor know who you are
                localStorage.setItem('active_user', user);
            } else {
                status.style.color = "#e74c3c";
                status.innerText = "Invalid Coordinates. Try again.";
            }
        }
    </script>
</body>
</html>
